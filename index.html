<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عالم رنو</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #0d0614;
            color: #f3e8ff;
            overflow-x: hidden;
        }
        .glow-purple {
            box-shadow: 0 0 35px rgba(168, 85, 247, 0.55);
        }
        .glass-card {
            background: rgba(26, 11, 46, 0.65);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(168, 85, 247, 0.25);
            cursor: pointer;
            user-select: none;
            touch-action: manipulation;
        }
        .glass-card:hover {
            border-color: rgba(168, 85, 247, 0.8);
            transform: translateY(-3px);
            background: rgba(38, 15, 66, 0.85);
        }
        .glass-card:active {
            transform: scale(0.98);
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .floating {
            animation: float 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center relative selection:bg-purple-500 selection:text-white py-12">

    <!-- خلفية جمالية متوهجة -->
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-full max-w-4xl h-96 bg-purple-900/25 blur-[120px] rounded-full pointer-events-none -z-10"></div>
    <div class="absolute bottom-10 right-10 w-72 h-72 bg-indigo-900/25 blur-[100px] rounded-full pointer-events-none -z-10"></div>

    <!-- المحتوى الرئيسي -->
    <main class="w-full max-w-md px-4 flex flex-col items-center z-10">
        
        <!-- الصورة الرمزية (رمز الافتار الشخصي البنفسجي الافتراضي) -->
        <div class="relative mb-6 floating">
            <div class="absolute -inset-1.5 rounded-full bg-gradient-to-r from-purple-600 via-indigo-500 to-purple-800 blur opacity-80"></div>
            <div class="relative w-32 h-32 rounded-full overflow-hidden border-2 border-purple-400 glow-purple bg-[#1a0b2e] flex items-center justify-center">
                
                <!-- SVG رمز افتار بنفسجي فخم ومدمج -->
                <svg class="w-full h-full p-2" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="38" r="18" fill="url(#purpleGrad)"/>
                    <path d="M 20 85 C 20 62, 32 58, 50 58 C 68 58, 80 62, 80 85 Z" fill="url(#purpleGrad)"/>
                    <defs>
                        <linearGradient id="purpleGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#c084fc"/>
                            <stop offset="1" stop-color="#7e22ce"/>
                        </linearGradient>
                    </defs>
                </svg>

            </div>
            <div class="absolute bottom-1 right-1 bg-purple-600 text-white rounded-full p-2 border-2 border-[#0d0614] text-xs shadow-md">
                <i class="fa-solid fa-crown text-amber-300"></i>
            </div>
        </div>

        <!-- الاسم -->
        <h1 class="text-3xl font-black text-white tracking-wider flex items-center gap-2 mb-8">
            ✨ عالم رنو ✨
        </h1>

        <!-- روابط التواصل -->
        <div class="w-full flex flex-col gap-4">
            
            <!-- رابط تويتش -->
            <a href="https://twitch.tv/ilnre" target="_blank" rel="noopener noreferrer" class="glass-card w-full p-4 rounded-2xl flex items-center justify-between transition-all duration-300 group">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-xl bg-purple-900/50 flex items-center justify-center text-purple-400 group-hover:text-white group-hover:bg-purple-600 transition-colors">
                        <i class="fa-brands fa-twitch text-2xl"></i>
                    </div>
                    <div>
                        <h2 class="font-bold text-white text-lg group-hover:text-purple-300 transition-colors">قناة تويتش</h2>
                    </div>
                </div>
                <div class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center text-purple-300 group-hover:translate-x-[-4px] transition-transform">
                    <i class="fa-solid fa-chevron-left text-sm"></i>
                </div>
            </a>

            <!-- رابط الدعم المادي -->
            <a href="https://creators.sa/sonahx76" target="_blank" rel="noopener noreferrer" class="glass-card w-full p-4 rounded-2xl flex items-center justify-between transition-all duration-300 group">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-xl bg-purple-900/50 flex items-center justify-center text-purple-400 group-hover:text-white group-hover:bg-purple-600 transition-colors">
                        <i class="fa-solid fa-heart text-2xl"></i>
                    </div>
                    <div>
                        <h2 class="font-bold text-white text-lg group-hover:text-purple-300 transition-colors">الدعم (Donation)</h2>
                    </div>
                </div>
                <div class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center text-purple-300 group-hover:translate-x-[-4px] transition-transform">
                    <i class="fa-solid fa-chevron-left text-sm"></i>
                </div>
            </a>

            <!-- رابط ديسكورد -->
            <a href="https://discord.gg/uY6TpcYEah" target="_blank" rel="noopener noreferrer" class="glass-card w-full p-4 rounded-2xl flex items-center justify-between transition-all duration-300 group">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-xl bg-purple-900/50 flex items-center justify-center text-purple-400 group-hover:text-white group-hover:bg-purple-600 transition-colors">
                        <i class="fa-brands fa-discord text-2xl"></i>
                    </div>
                    <div>
                        <h2 class="font-bold text-white text-lg group-hover:text-purple-300 transition-colors">مجتمع ديسكورد</h2>
                    </div>
                </div>
                <div class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center text-purple-300 group-hover:translate-x-[-4px] transition-transform">
                    <i class="fa-solid fa-chevron-left text-sm"></i>
                </div>
            </a>

        </div>

    </main>

</body>
</html>
